name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Node 22 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run version:check
      - run: npm run build
      - name: Verify committed plugin artifacts
        run: git diff --exit-code -- claude-codex/dist/mcp-server.mjs hermes/dist hermes/skills
      - run: npm run pack:check
      - run: npm run host:check
      - name: Install minimum OpenCode host
        if: runner.os != 'Windows'
        run: |
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund opencode-ai@1.17.0
          node node_modules/opencode-ai/postinstall.mjs
      - name: Verify minimum OpenCode loader
        if: runner.os != 'Windows'
        run: npm run host:check:opencode
        env:
          OPENCODE_CLI: node_modules/.bin/opencode
      - name: Install current OpenCode host
        if: runner.os != 'Windows'
        run: |
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund opencode-ai@1.18.21
          node node_modules/opencode-ai/postinstall.mjs
      - name: Verify current OpenCode loader
        if: runner.os != 'Windows'
        run: npm run host:check:opencode
        env:
          OPENCODE_CLI: node_modules/.bin/opencode
      - name: Verify current OMP loader
        if: runner.os != 'Windows'
        run: npm run host:check:omp
        env:
          OMP_VERSION: 18.0.4
